name: Fahrzeugbestand abrufen

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:   # wird alle 30 Min. von cron-job.org angestoßen (GitHub verzögert den Zeitplan oben um Stunden)

# Nie zwei Abrufe gleichzeitig – sonst scheitert der zweite beim Push.
concurrency:
  group: bestand
  cancel-in-progress: false

jobs:
  fetch-bestand:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Fahrzeugbestand von Mobile.de abrufen
        env:
          MOBILE_USER: ${{ secrets.MOBILE_USER }}
          MOBILE_PASS: ${{ secrets.MOBILE_PASS }}
        run: python3 fetch_bestand.py

      - name: JSON committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bestand.json
          if git diff --staged --quiet; then
            echo "Keine Änderung am Bestand."
          else
            git commit -m "Bestand aktualisiert $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
